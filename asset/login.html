<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ログイン | 下落通知</title><link rel="stylesheet" href="common.css"><script src="sample-data.js" defer></script><script src="preview.js" defer></script></head>
<body data-page="login">
<details class="preview"><summary>画面確認用 · ログインのサンプル</summary><div class="preview-content"><label for="preview-state">表示状態</label><select id="preview-state"><option value="normal">通常</option><option value="sending">送信中</option><option value="auth-error">認証エラー</option><option value="network-error">通信失敗</option><option value="limited">試行制限</option></select><p>1〜100文字のID・8〜72 UTF-8バイトのパスワードで一覧へ進めます。実際の認証は行いません。</p><a href="../ui/login.md">画面仕様</a> · <a href="register.html">登録画面の見本</a></div></details>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="login.html"><span class="brand-mark" aria-hidden="true">↘</span><div><div class="brand-name">下落通知</div><div class="brand-sub">MARKET WATCH</div></div></a><span class="muted small">株・指数のモニタリング</span></div></header>
<main class="login-container"><div class="login-hero"><p class="eyebrow">WELCOME BACK</p><h1>ログイン</h1><p class="description">監視対象と通知の設定を管理します。</p></div><section class="card login-card" aria-label="ユーザーログイン"><form id="login-form" novalidate><div class="field"><label for="login-id">ログインID</label><input id="login-id" name="login_id" autocomplete="username" required placeholder="ログインID"></div><div class="field"><label for="password">パスワード</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="72" required placeholder="パスワードを入力"></div><div id="login-error" class="alert" role="alert" hidden></div><button id="login-button" class="primary login-submit" type="submit">ログイン</button><div id="login-status" class="status" role="status" aria-live="polite"></div></form><p class="security-note">ご自身の銘柄・通知設定を管理します。ログインの有効期限は24時間です。</p></section><p class="description small">初めて利用する方は、LINE公式アカウントを友だち追加し、トークに届くURLから登録してください。URLが届かない／期限切れの場合は「登録」と送信してください。</p><p class="login-footer">下落通知 · 株と指数を、毎日見守る。</p></main>
